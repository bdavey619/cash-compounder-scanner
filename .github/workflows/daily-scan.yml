name: Daily cash-compounder scan

on:
  schedule:
    # Weekdays at 23:17 UTC (3:17 pm Pacific in winter), after the US close
    - cron: "17 23 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write   # to save the track record (track/ledger.json) back to the repo
  pages: write
  id-token: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Slim SEC company facts; the bulk archive is re-downloaded when older than a day
      - name: Restore fundamentals cache
        uses: actions/cache@v4
        with:
          path: .cache/companyfacts
          key: companyfacts-${{ github.run_id }}
          restore-keys: companyfacts-

      - name: Self-test on sample data
        run: python -m unittest discover tests

      - name: Run scan
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python -m scanner.scan --out site --ledger track/ledger.json

      - name: Include the latest backtest
        run: if [ -d backtest ]; then cp -r backtest site/backtest; fi

      # The track record has to survive between runs, so it lives in the repo
      - name: Save track record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          mkdir -p data && cp site/results.json data/latest.json
          git add track/ledger.json data/latest.json
          if git diff --cached --quiet; then echo "track record unchanged"; exit 0; fi
          git commit -m "Track record: $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase --quiet && git push && exit 0; sleep 5; done
          echo "::warning::Could not save the track record this run"

      - name: Keep a dated copy
        run: |
          mkdir -p site/archive
          cp site/index.html "site/archive/$(date -u +%F).html"

      - uses: actions/upload-artifact@v4
        with:
          name: scan-${{ github.run_id }}
          path: site
          retention-days: 30

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publish:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
