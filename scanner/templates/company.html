__NAV__
<main class="wrap" id="page"></main>
<script>
const COS = __COMPANIES__;
const META = __META__;
const pct = (x, d = 1) => x == null || !isFinite(x) ? (x === Infinity ? '>200%' : '–') : (x > 0 ? '+' : x < 0 ? '−' : '') + Math.abs(x * 100).toFixed(d) + '%';
const pl = (x, d = 1) => x == null || !isFinite(x) ? '–' : (x * 100).toFixed(d) + '%';
const money = b => b == null || !isFinite(b) ? '–' : (b < 0 ? '−' : '') + (Math.abs(b) >= 1000 ? '$' + (Math.abs(b) / 1000).toFixed(2) + 'T' : Math.abs(b) >= 100 ? '$' + Math.abs(b).toFixed(0) + 'B' : Math.abs(b) >= 1 ? '$' + Math.abs(b).toFixed(Math.abs(b) < 10 ? 2 : 1) + 'B' : '$' + (Math.abs(b) * 1000).toFixed(Math.abs(b) < 0.01 ? 1 : 0) + 'M');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmtD = (d, short) => d ? new Date(d + 'T12:00:00').toLocaleDateString('en-US', short ? { month: 'short', year: 'numeric' } : { month: 'short', day: 'numeric', year: 'numeric' }) : '–';
const BASE_R = META.rules.REQUIRED_RETURN, GT0 = META.rules.TERMINAL_GROWTH || 0.03;
let st = {}, cur = null;
const pc = x => Math.round(x * 100);

function pv(f0, g, r, gt) { let v = 0, f = f0; for (let t = 1; t <= 10; t++) { f *= 1 + g; v += f / Math.pow(1 + r, t); } return v + f * (1 + gt) / (r - gt) / Math.pow(1 + r, 10); }
function implied(f0, target, r, gt) {
  if (f0 <= 0 || target <= 0) return NaN;
  let lo = -0.6, hi = 2; if (pv(f0, hi, r, gt) < target) return Infinity; if (pv(f0, lo, r, gt) > target) return -Infinity;
  for (let i = 0; i < 90; i++) { const m = (lo + hi) / 2; if (pv(f0, m, r, gt) < target) lo = m; else hi = m; } return (lo + hi) / 2;
}

function cue(c) { const N = COS.length; return c.rank <= N / 3 ? ['cheap', 'Cheap'] : c.rank <= 2 * N / 3 ? ['mid', 'Middle'] : ['pricey', 'Pricey']; }
function shortSummary(c) {
  const R = META.rates || {}, rf = R.rf, out = [], g = c.impl;
  if (c.yld != null && c.yld <= 0) out.push(`<b>No spare cash</b> right now: its price is a bet on the future.`);
  else if (c.yld != null) out.push(`<b>${pc(c.yld)}¢ back per $1</b> a year` + (rf ? (c.yld / rf >= 1.15 ? `, ${(c.yld / rf).toFixed(1)}× a safe bond’s ${(rf * 100).toFixed(1)}¢.` : c.yld / rf >= 0.85 ? `, about the same as a safe bond (${(rf * 100).toFixed(1)}¢).` : `, less than a safe bond’s ${(rf * 100).toFixed(1)}¢.`) : '.'));
  if (g != null && isFinite(g) && c.rec != null)
    out.push(`The price bets on <b>${pct(g, 0)} a year</b>; it has grown <b>${pct(c.rec, 0)}</b> lately. ` + (g < c.rec - 0.05 ? 'The market expects a slowdown.' : g > c.rec + 0.03 ? 'It needs things to go well.' : 'Fair if it keeps that up.'));
  return out.join('<br>');
}
function plainSummary(c) {
  const R = META.rates || {}, rf = R.rf, out = [];
  if (c.yld != null && c.yld <= 0) out.push(`${esc(c.name)} isn’t producing spare cash right now: on our measure it used about <b>${Math.abs(pc(c.yld))}¢ more cash than it made</b> for every $1 you’d pay for the company. Its price is a bet on the future, not on today’s cash.`);
  else if (c.yld != null) {
    const mult = rf ? c.yld / rf : null;
    out.push(`For every $1 you’d pay for ${esc(c.name)}, the business produces about <b>${pc(c.yld)}¢ of spare cash a year</b>` +
      (mult ? (mult >= 1.15 ? `, about ${mult.toFixed(1)}× what a safe government bond pays (${(rf * 100).toFixed(1)}%).` : mult >= 0.85 ? `, about the same as a safe government bond (${(rf * 100).toFixed(1)}%).` : `, less than a safe government bond pays (${(rf * 100).toFixed(1)}%), so investors must be expecting growth.`) : '.'));
  }
  const since = c.m && c.m.first_fy ? `Since ${fmtD(c.m.first_fy, true)} (about ${c.m.yrs.toFixed(1)} years)` : 'Recently';
  if (c.rec != null) out.push(c.rec >= 0 ? `${since}, its cash and sales per share grew about <b>${pc(c.rec)}% a year</b>.` : `${since}, its cash and sales per share actually <b>shrank about ${Math.abs(pc(c.rec))}% a year</b>.`);
  const g = c.impl;
  if (g != null && isFinite(g) && c.rec != null) {
    if (g < c.rec - 0.05) out.push(`But today’s price only makes sense if its cash ${g < 0 ? `<b>shrinks about ${Math.abs(pc(g))}% a year</b>` : `grows just <b>${pc(g)}% a year</b>`} for the next 10 years. Either the market sees trouble ahead, or it’s being too pessimistic. That’s the question to research.`);
    else if (g > c.rec + 0.03) out.push(`Today’s price already expects its cash to grow <b>${pc(g)}% a year</b> for 10 years, faster than its past. The market is optimistic here, so the stock needs things to go well.`);
    else out.push(`Today’s price expects about <b>${pc(g)}% a year</b> for the next 10 years, close to its past. The price looks fair if the company keeps it up.`);
  }
  const t = c.tags.map(x => x[0]);
  const extra = [];
  if (t.includes('Cyclical')) extra.push('its cash swings with the economy (boom-and-bust), so we use a 3-year average');
  if (t.includes('Peak margins')) extra.push('it’s having an unusually good year, so we judge it on a normal one');
  if (t.includes('Leveraged')) extra.push('it carries a lot of debt, which adds risk');
  if (t.includes('Fell sharply')) extra.push('its price dropped a lot recently');
  if (extra.length) out.push('Worth knowing: ' + extra.join('; ') + '.');
  return out.join(' ');
}

const EXTRA = {};
function show() {
  const t = decodeURIComponent(location.hash.slice(1)).toUpperCase();
  const i = COS.findIndex(c => c.t === t);
  const page = document.getElementById('page');
  if (i >= 0) return render(COS[i], COS[i - 1], COS[i + 1]);
  if (!t) { page.innerHTML = '<p class="muted">No company selected. Use “Look up any company” above, or <a href="index.html">see today’s ranking</a>.</p>'; return; }
  if (EXTRA[t]) return render(EXTRA[t]);
  if (!/^[A-Z0-9.\-]{1,10}$/.test(t)) { notFound(t); return; }
  page.innerHTML = `<p class="muted">Loading ${esc(t)}…</p>`;
  fetch('c/' + encodeURIComponent(t) + '.json').then(r => { if (!r.ok) throw 0; return r.json(); })
    .then(c => { EXTRA[t] = c; if (decodeURIComponent(location.hash.slice(1)).toUpperCase() === t) render(c); })
    .catch(() => notFound(t));
}
function notFound(t) {
  document.title = 'Cash Compounders · Company';
  document.getElementById('page').innerHTML = `<p class="muted">We don’t have ${esc(t)}. We cover US companies that file with the SEC and have at least $500M of yearly sales and a recent share price. <a href="index.html">Back to today’s ranking</a></p>`;
}
function wouldRank(c) { return c.rank || (c.yld == null ? COS.length + 1 : 1 + COS.filter(x => x.yld > c.yld).length); }
const WHY = {
  financial: c => 'It’s a bank, lender, broker or insurer. Their cash flow mixes in customers’ money, so “spare cash” doesn’t mean the same thing. Treat the numbers below with extra caution.',
  fcf_margin: c => c.margin == null ? 'We couldn’t measure how much of each $1 of sales it keeps as spare cash.' : c.margin <= 0 ? `It didn’t make spare cash over the last 12 months (${pc(c.margin)}¢ per $1 of sales). The list needs at least 15¢.` : `It keeps about ${pc(c.margin)}¢ of each $1 of sales as spare cash (latest 12 months). The list needs at least 15¢.`,
  fcf_consistency: c => 'It didn’t make spare cash in every one of its last three years and the latest 12 months. The list needs all of them.',
  return_on_capital: c => c.roc == null ? 'We couldn’t measure how much cash it earns on the money invested in it.' : `It earns about ${pl(c.roc, 0)} a year in cash on the money invested in it. The list needs at least 10%.`,
  implausible_fcf_margin: c => 'Its cash per $1 of sales looks implausibly high (over 90¢), usually a sign its filings mix in something unusual.',
  market_cap: c => `The whole company is worth ${money(c.mcap)}. The list needs at least $2B.`,
};
function whyBanner(c) {
  if (c.onList !== false) return '';
  const items = (c.why || []).map(k => WHY[k] ? `<li>${WHY[k](c)}</li>` : '').join('');
  return `<section class="card why"><h2>Why it’s not on the list</h2><ul>${items || '<li>It doesn’t pass the list’s cash tests.</li>'}</ul>
    <p class="muted">Everything below is worked out the same way as for the companies on the list, so you can still see what its price is betting on. The tests exist because these numbers are less reliable for businesses that don’t make steady spare cash.</p></section>`;
}
function render(c, prev, next) {
  if (cur !== c.t) st = { r: BASE_R, gt: GT0, base: c.defaultBase || 0 };
  const sameCo = cur === c.t; cur = c.t;
  if (!sameCo) OPEN.clear();
  const plain = CC.mode === 'plain', L = CC.L, I = CC.info, N = COS.length, WR = wouldRank(c), cq = cue({ rank: WR });
  const R0 = META.rates || {};
  document.title = `${c.t} · ${c.name} · Cash Compounders`;
  const tags = c.tags.map(([x, k]) => `<span class="tag ${k}" tabindex="0" data-tip="${CC.def(x).replace(/"/g, '&quot;')}">${L(x)}</span>`).join(' ');
  const netNote = c.net < 0 && c.fcf > 0 ? `${(-c.net / c.fcf).toFixed(1)}× free cash flow` : 'cash − long-term debt';
  page.innerHTML = `
  <div class="crumbs"><span><a href="index.html">Today</a> <span aria-hidden="true">›</span> ${esc(c.name)}</span>
    <span>${prev ? `<a href="#${prev.t}">‹ ${prev.t}</a>` : ''}${prev && next ? ' · ' : ''}${next ? `<a href="#${next.t}">${next.t} ›</a>` : ''} <span class="faint">by ${plain ? 'cash per $1' : 'FCF yield'}</span></span></div>
  <div class="top">
    <div>
      <div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap">
        <h1 class="h1" style="margin:0;font-size:34px">${c.t}</h1>

function ttmLine(label, p) {
  if (!p || p.fy == null) return '';
  const add = x => (x < 0 ? '− ' : '+ ') + Bs(Math.abs(x)), sub = x => (x < 0 ? '+ ' : '− ') + Bs(Math.abs(x));
  return `<div class="calc">${label}: ${Bs(p.fy)} (year to ${fmtD(p.fy_end)}) ${add(p.ytd)} (${fmtD(p.ytd_start)}–${fmtD(p.ytd_end)}) ${sub(p.prior)} (same months a year earlier) = ${Bs(p.fy + p.ytd - p.prior)}</div>`;
}
function fcfSteps(c) {
  const m = c.m;
  const ttm = m.basis === 'TTM' && m.parts;
  let h = `<li><b>Free cash flow</b> = cash from operations − capital spending − stock-based pay.`;
  if (ttm) h += ` The last annual report ends ${fmtD(m.parts.ocf.fy_end)}, but newer quarterly reports exist, so we use the <b>latest 12 months</b> (to ${fmtD(m.end)}): the full year, plus this year’s months so far, minus the same months last year.`
    + ttmLine('Cash from operations', m.parts.ocf) + ttmLine('Capital spending', m.parts.capex) + (m.parts.sbc ? ttmLine('Stock-based pay', m.parts.sbc) : '');
  else h += ` From the annual report for the year ending ${fmtD(m.end)}.`;
  h += `<div class="calc">${Bs(m.ocf)} − ${Bs(m.capex)} − ${Bs(m.sbc)} = <b>${Bs(F(c))}</b></div>`;
  if (!m.sbc) h += `<span style="font-size:13px;display:block;margin-bottom:4px" class="muted"><b>Note:</b> no stock-based pay was found in this company’s filings under the standard label, so it counts as $0 here. If its cash flow statement lists stock-based compensation, the true free cash flow is a little lower.</span>`;
  h += `<span class="faint" style="font-size:13px">Why subtract stock-based pay? Paying employees in shares costs no cash, but it gives part of the company away, so owners lose it just the same.</span></li>`;
  return h;
}
function mcapStep(c) {
  const m = c.m;
  return `<li><b>Company value</b> (market cap) = share price × number of shares. The share count comes from the ${m.shares_src || 'latest filing'} (${fmtD(m.shares_date)}).
    <div class="calc">$${c.price.toFixed(2)} × ${SH(m.shares)} shares = <b>${Bs(c.mcapRaw)}</b></div></li>`;
}
function baseStep(c) {
  const m = c.m;
  if (c.baseKind === 'avg3') { const r3 = m.rows.slice(-3);
    return `<li><b>Boom-and-bust adjustment.</b> This company’s cash swings a lot from year to year, so one year can mislead. We use the average of its last three fiscal years instead.
      <div class="calc">(${r3.map(r => Bs(r.fcf)).join(' + ')}) ÷ 3 = <b>${Bs(m.fcf_avg3)}</b></div></li>`; }
  if (c.baseKind === 'normalized') return `<li><b>Unusually-good-year adjustment.</b> It’s keeping far more cash per $1 of sales than usual. We assume a normal year instead: today’s sales at its ${m.margin_years}-year average margin.
      <div class="calc">${Bs(m.revenue)} sales × ${P(m.margin_avg)} average margin = <b>${Bs(c.fcfBase * 1e9)}</b></div></li>`;
  return '';
}
function mathHTML(c, k) {
  const m = c.m, L = CC.L;
  if (!m) return '<p class="muted">The detailed inputs for this company aren’t available in today’s data.</p>';
  const base = c.baseKind === 'latest' ? F(c) : c.fcfBase * 1e9;
  if (k === 'yld') return `<div class="formula">${L('yld')} <span class="eq">=</span> free cash flow ÷ company value</div><ol class="steps">${fcfSteps(c)}${mcapStep(c)}
    <li><b>Divide.</b><div class="calc">${Bs(F(c))} ÷ ${Bs(c.mcapRaw)} = <b>${P(F(c) / c.mcapRaw, 2)}</b></div>So for every $1 you’d pay for the whole company, it produced about <b>${Math.round(F(c) / c.mcapRaw * 100)}¢</b> of spare cash over the last 12 months. The list is ranked on this number.${c.baseKind !== 'latest' ? ` <span class="muted">(The price’s bet starts from an adjusted, lower figure for this company; see “${L('impl')}”.)</span>` : ''}</li></ol>`;
  if (k === 'pfcf') return `<div class="formula">${L('pfcf')} <span class="eq">=</span> company value ÷ free cash flow</div><ol class="steps">${fcfSteps(c)}${mcapStep(c)}
    <li><b>Divide.</b><div class="calc">${Bs(c.mcapRaw)} ÷ ${Bs(F(c))} = <b>${(c.mcapRaw / (F(c))).toFixed(1)}</b></div>If the company kept making the same cash and handed it all to you, it would take about <b>${(c.mcapRaw / (F(c))).toFixed(1)} years</b> to earn back the price. It’s also 1 ÷ cash back per $1.</li></ol>`;
  if (k === 'margin') return `<div class="formula">${L('margin')} <span class="eq">=</span> free cash flow ÷ revenue (sales)</div><ol class="steps">${fcfSteps(c)}
    <li><b>Revenue</b> for the same 12 months${m.basis === 'TTM' && m.parts && m.parts.rev ? ', built the same way:' + ttmLine('Revenue', m.parts.rev) : `: <b>${Bs(m.revenue)}</b>.`}${m.rev_estimated ? ' <span class="faint">(The latest quarter’s revenue wasn’t tagged in a standard way, so it’s estimated from the last annual report.)</span>' : ''}</li>
    <li><b>Divide.</b><div class="calc">${Bs(F(c))} ÷ ${Bs(m.revenue)} = <b>${P(c.margin)}</b></div>Of every $1 of sales, about <b>${Math.round(c.margin * 100)}¢</b> ends up as spare cash. To make our list a company needs at least 15¢ over the latest 12 months.</li></ol>`;
  if (k === 'roc') { const cap = (m.equity || 0) + (m.ltd || 0);
    return `<div class="formula">${L('roc')} <span class="eq">=</span> free cash flow ÷ (owners’ equity + long-term debt)</div><ol class="steps">${fcfSteps(c)}
    <li><b>Money invested</b> = what owners have put in and left in the business (equity) plus what it has borrowed long-term, from the balance sheet.
      <div class="calc">${Bs(m.equity)} equity (${fmtD(m.equity_date)}) + ${Bs(m.ltd || 0)} long-term debt (${fmtD(m.ltd_date)}) = <b>${Bs(cap)}</b></div>${m.equity != null && m.equity < 0 ? '<span class="faint" style="font-size:13px">Negative equity usually means the company has bought back more stock than it originally raised, so this ratio can look extreme.</span>' : ''}</li>
    <li><b>Divide.</b><div class="calc">${Bs(F(c))} ÷ ${Bs(cap)} = <b>${P(c.roc, 0)}</b></div>Each year the business produces cash equal to about ${P(c.roc, 0)} of the money invested in it. Our minimum is 10%.</li></ol>`; }
  if (k === 'shares') return `<div class="formula">${L('shares')} <span class="eq">=</span> (shares now ÷ shares then)<sup>1 ÷ years</sup> − 1</div><ol class="steps">
    <li><b>Shares then and now:</b> the diluted share count from the annual reports for ${fmtD(m.sh_first_fy, true)} and ${fmtD(m.sh_last_fy, true)}, ${m.sh_yrs.toFixed(1)} years apart.
      <div class="calc">${SH(m.sh_first)} → ${SH(m.sh_last)}</div></li>
    <li><b>Yearly rate.</b> Like a savings account in reverse, we find the steady yearly change that turns one into the other:
      <div class="calc">(${SH(m.sh_last)} ÷ ${SH(m.sh_first)})^(1 ÷ ${m.sh_yrs.toFixed(2)}) − 1 = <b>${SP(c.shares)}</b> a year</div>${c.shares < 0 ? 'Fewer shares means each remaining share owns a bigger slice of the company. Companies do this by buying back their own stock.' : 'More shares means each existing share owns a smaller slice, usually from paying employees in stock.'}</li></ol>`;
  if (k === 'net') { const nd = (m.ltd || 0) - (m.cash || 0) - (m.sti || 0);
    return `<div class="formula">${nd >= 0 ? 'Debt minus cash' : 'Cash minus debt'} <span class="eq">=</span> long-term debt − cash − short-term investments</div><ol class="steps">
    <li><b>From the latest balance sheet:</b><div class="calc">${Bs(m.ltd || 0)} debt (${fmtD(m.ltd_date)}) − ${Bs(m.cash || 0)} cash (${fmtD(m.cash_date)}) − ${Bs(m.sti || 0)} short-term investments = <b>${Bs(nd)}</b></div></li>
    <li>${nd > 0 && c.fcf > 0 ? `Compare it with yearly cash: ${Bs(nd)} ÷ ${Bs(F(c))} = <b>${(nd / (F(c))).toFixed(1)} years</b> of free cash flow to pay it all off. Above 3 years, we make the company clear a higher bar.` : 'The company has more cash than long-term debt, a cushion if business slows.'}</li></ol>`; }
  if (k === 'rec') { const s = m.sh_first && m.sh_last ? Math.pow(m.sh_last / m.sh_first, 1 / m.sh_yrs) - 1 : 0;
    const gf = m.first_fcf > 0 && c.fcf > 0 ? Math.pow(F(c) / m.first_fcf, 1 / m.yrs) - 1 : null;
    const gr = m.first_rev > 0 && m.revenue > 0 ? Math.pow(m.revenue / m.first_rev, 1 / m.yrs) - 1 : null;
    const ps = g => g == null ? null : (1 + g) / (1 + s) - 1;
    return `<div class="formula">${L('rec')} <span class="eq">=</span> the slower of cash growth and sales growth, per share, capped at 20%</div><ol class="steps">
    <li><b>Cash growth per year</b> from the year to ${fmtD(m.first_fy)} to the latest 12 months (${m.yrs.toFixed(1)} years):
      <div class="calc">(${Bs(F(c))} ÷ ${Bs(m.first_fcf)})^(1 ÷ ${m.yrs.toFixed(2)}) − 1 = ${SP(gf)}</div></li>
    <li><b>Sales growth per year</b>, same period:<div class="calc">(${Bs(m.revenue)} ÷ ${Bs(m.first_rev)})^(1 ÷ ${m.yrs.toFixed(2)}) − 1 = ${SP(gr)}</div></li>
    <li><b>Per share.</b> The share count changed ${SP(s)} a year (see “${L('shares')}”), so each share’s slice grew by:
      <div class="calc">cash: (1 ${gf >= 0 ? '+' : '−'} ${Math.abs(gf * 100).toFixed(1)}%) ÷ (1 ${s >= 0 ? '+' : '−'} ${Math.abs(s * 100).toFixed(1)}%) − 1 = ${SP(ps(gf))}<br>sales: (1 ${gr >= 0 ? '+' : '−'} ${Math.abs(gr * 100).toFixed(1)}%) ÷ (1 ${s >= 0 ? '+' : '−'} ${Math.abs(s * 100).toFixed(1)}%) − 1 = ${SP(ps(gr))}</div></li>
    <li><b>Take the slower one</b> (so one lucky number can’t flatter it) and cap it at 20%: <b>${SP(c.rec)}</b> a year.</li></ol>`; }
  if (k === 'impl') { const r = c.req, gt = META.rules.TERMINAL_GROWTH || 0.03, nc = (c.net || 0) * 1e9, target = c.mcapRaw - nc;
    const g = implied(base, target, r, gt);   // re-solved from the exact inputs, so the table adds up to the penny
    if (g == null || !isFinite(g)) return '<p class="muted">The price can’t be matched with any sensible growth rate for this company.</p>';
    let rows = '', cash = base, tot = 0;
    for (let t = 1; t <= 10; t++) { cash *= 1 + g; const df = 1 / Math.pow(1 + r, t), pv = cash * df; tot += pv;
      rows += `<tr><td>Year ${t}</td><td>${Bs(cash)}</td><td>${df.toFixed(3)}</td><td>${Bs(pv)}</td></tr>`; }
    const term = cash * (1 + gt) / (r - gt), tdf = 1 / Math.pow(1 + r, 10), tpv = term * tdf; tot += tpv;
    const tryG = x => { let v = 0, f = base; for (let t = 1; t <= 10; t++) { f *= 1 + x; v += f / Math.pow(1 + r, t); } return v + f * (1 + gt) / (r - gt) / Math.pow(1 + r, 10); };
    return `<div class="formula">${L('impl')} <span class="eq">=</span> the yearly growth rate that makes the value of all future cash equal today’s price</div><ol class="steps">
    <li><b>What the price has to justify:</b> company value ${nc >= 0 ? 'minus its spare cash (cash minus debt), which you’d get with it' : 'plus its net debt, which a buyer takes on too'}.
      <div class="calc">${Bs(c.mcapRaw)} ${nc >= 0 ? '−' : '+'} ${Bs(Math.abs(nc))} = <b>${Bs(target)}</b></div></li>
    ${baseStep(c)}<li><b>Start from this year’s cash</b> (${Bs(base)}${c.baseKind !== 'latest' ? ', the adjusted figure above' : ''}) and grow it at a guessed rate for 10 years, then ${P(gt, 0)} a year forever.</li>
    <li><b>Discount each year’s cash</b> back to today at ${P(r, 2)} a year, the return you’d demand (${P(META.rates.rf, 2)} safe bond + ${P(META.rules.EQUITY_PREMIUM, 0)}${c.premium ? ' + ' + P(c.premium, 1) + ' extra risk' : ''}). $1 arriving in 10 years is worth only $${(1 / Math.pow(1 + r, 10)).toFixed(2)} today.</li>
    <li><b>Guess and check.</b> Try growth rates until the total matches ${Bs(target)}:
      <div class="calc">0% growth → ${Bs(tryG(0))} · 5% growth → ${Bs(tryG(0.05))} · <b>${SP(g)} growth → ${Bs(tryG(g))}</b> ✓</div>
      <table class="dcf"><thead><tr><th>Year</th><th>Cash that year</th><th>× discount</th><th>= worth today</th></tr></thead><tbody>${rows}
      <tr><td>After year 10 (forever)</td><td>${Bs(term)}</td><td>${tdf.toFixed(3)}</td><td>${Bs(tpv)}</td></tr>
      <tr class="tot"><td>Total</td><td></td><td></td><td>${Bs(tot)}</td></tr></tbody></table>
      So today’s price makes sense only if cash grows about <b>${SP(g)} a year</b>. Compare that with its ${L('rec').toLowerCase()} of ${SP(c.rec)}.</li></ol>
      <p class="faint" style="font-size:12.5px;margin:0 0 12px">The “forever” value uses the growing-perpetuity formula: cash in year 11 ÷ (return − long-run growth). Spreadsheets can do the guess-and-check for you with Goal Seek.</p>`; }
  return '';
}
function toggleMath(c, btn) {
  const k = btn.dataset.k;
  let box = document.getElementById('math');
  document.querySelectorAll('.mathlink').forEach(b => b.setAttribute('aria-expanded', 'false'));
  if (box && mathKey === k) { box.remove(); mathKey = null; btn.focus(); return; }   // second click closes it
  if (box) box.remove();
  mathKey = k;
  box = document.createElement('section');
  box.id = 'math'; box.className = 'card'; box.setAttribute('aria-label', 'How ' + CC.L(k) + ' is calculated');
  box.innerHTML = `<div class="mhead"><div><h2 style="margin:0 0 2px">How “${CC.L(k)}” is calculated</h2>
      <p class="muted" style="margin:0;font-size:13px">Using ${esc(c.name)}’s own figures from its annual (10-K) and quarterly (10-Q) reports.</p></div>
      <button class="mclose" aria-label="Close">×</button></div>${mathHTML(c, k)}`;
  // open it right where the link was clicked: under the row of numbers, or inside the price chart card
  const inBet = btn.closest('#betlinks');
  if (inBet) inBet.insertAdjacentElement('afterend', box); else document.getElementById('tiles').insertAdjacentElement('afterend', box);
  btn.setAttribute('aria-expanded', 'true');
  box.querySelector('.mclose').onclick = () => toggleMath(c, btn);
  const r = box.getBoundingClientRect();
  if (r.top < 0 || r.top > innerHeight * 0.6) box.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

window.addEventListener('hashchange', show);
CC.on(show);
show();
</script>
</body>
</html>
